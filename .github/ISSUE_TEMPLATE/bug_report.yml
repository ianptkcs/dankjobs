name: Bug report
description: Report incorrect behavior in tjobs
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run tjobs with '...'
        2. Press '...'
        3. See the error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, terminal emulator, tjobs version/commit, etc.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs or screenshots here. Never paste API keys or tokens.
    validations:
      required: false
