[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobs-tui"
version = "0.1.0"
description = "TUI to browse and manage jobs scheduled as systemd user timers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "textual>=0.80",
]

[project.scripts]
jobs-tui = "app:main"

[tool.hatch.build.targets.wheel]
include = ["app.py"]
